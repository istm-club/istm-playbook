ee speeches. Please welcome our first free speaker!","Hello, everyone. Today I'd like to share a small story from my weekend."]}},{who:"timer",text:"타임 리포트 → 의장에게 알림",more:{tips:["워밍업 전체 5분을 재고, 끝나면 의장에게 신호해요"]}}]},{id:"toastmasters",part:1,no:2,title:"Toastmasters",sub:"역할 소개",time:"10:45",duration:"15분",lead:"Toastmaster",color:"#164f7d",icon:"mic",lines:["테마 질문 소개","역할자 소개 · 1~2분씩"],steps:[{who:"toastmaster",text:"테마 질문 소개",more:{tips:["사회자 인사 + 역할 설명 후, 오늘의 테마 질문을 소개해요"],script:"toastmaster",examples:[`Today's theme is "Gift." Our theme question is: What is the most meaningful gift you've ever received?`]}},{who:"toastmaster",text:"역할자 소개",flowRoles:["timer","ah_counter","hark_master","grammarian","general_evaluator"],more:{examples:["Let me invite our Timer to explain the role and answer the theme question."]}},{who:"all",text:"역할자: 역할 설명 + 테마 질문 답변",time:"1–2분씩",more:{tips:["굵은 글씨만 읽어도 충분해요",`테마 질문은 "To answer today's theme question, …"로 1~2문장`],scripts:["timer","ah_counter","hark_master","grammarian","general_evaluator"]}}]},{id:"prepared",part:1,no:3,title:"Prepared Speech",sub:"준비된 연설",time:"11:00",duration:"30분",lead:"Toastmaster",color:"#1d6fb8",icon:"megaphone",star:"Speaker 1 · 2 · 3 — 5~7분씩",lines:["평가자 목표 설명 → 연설","1 Minute of Silence","타임 리포트 → 투표"],stepsNote:"2~6번을 연설자 수만큼 반복해요. (예시 아젠다: 연설자 3명)",speaker:{title:"Prepared Speech 연설자",tasks:[{title:"평가 시트를 연설 평가자에게 미리 전달"},{title:"사회자 소개를 받고 무대로"},{title:"준비된 연설",time:"5–7분"},{title:"Ice Breaker(첫 연설)라면",time:"4–6분"},{title:"초록 · 노랑 · 빨강 카드로 시간 확인"},{title:"연설 후 사회자에게 무대 넘기기"}]},steps:[{who:"toastmaster",text:"준비된 연설 목적 설명",more:{examples:["In this session, members practice speeches from their Pathways projects."]}},{who:"speech_evaluator",text:"연설 목적 · 프로젝트 · 시간 소개",more:{tips:["사회자 요청 시, 연설자의 프로젝트와 목표를 짧게 소개해요","연설자에게 미리 받은 평가 시트를 확인해요"],examples:["Today's speaker is working on Effective Body Language. The goal is to use gestures that support the message. The speech is 5 to 7 minutes."]}},{who:"toastmaster",text:"연설자 소개",flow:["이름","제목","제목","이름"],more:{tips:["이름과 제목을 두 번씩 불러요"],examples:['Our next speaker is Mia Kim. The title is "Priceless." "Priceless," Mia Kim!']}},{who:"speaker",text:"준비된 연설 (Ice Breaker는 4–6분)",time:"5–7분",more:{tips:["평가 시트는 연설 전에 연설 평가자에게 전달","타이머 카드: 초록 5:00 · 노랑 6:00 · 빨강 7:00 (Ice Breaker 4·5·6분)","연설이 끝나면 사회자에게 무대를 넘겨요"]}},{who:"all",text:"1 Minute of Silence · 평가 메모",time:"1분",more:{tips:["연설마다 1분 동안 피드백을 적어요","타이머가 1분을 재고 사회자에게 알려요"],examples:["Let's take one minute of silence so everyone can write feedback."]}},{who:"timer",text:"타임 리포트 → 최우수 연설자 투표",time:"연설자 전원 끝난 뒤",more:{examples:["Speaker one spoke for 6 minutes and 10 seconds, so qualified. Please vote for the Best Speaker."]}}]},{id:"break",part:1,no:4,title:"쉬는 시간",sub:"Intermission",time:"11:30",duration:"10+3분",lead:"Intermission · Warm up",color:"#64748b",icon:"coffee",lines:["휴식 10분 + 워밍업 3분"],steps:[{who:"all",text:"휴식",time:"10분"},{who:"all",text:"워밍업 → 2부 시작",time:"3분"}]},{id:"evaluation1",part:2,no:1,title:"Evaluation 1",sub:"평가 세션 1",time:"11:43",duration:"15분",lead:"General Evaluator",color:"#7b1a31",icon:"clipboard",star:"Evaluator 1 · 2 · 3 — 2~3분씩",lines:["준비된 연설 평가","타임 리포트 → 투표"],steps:[{who:"general_evaluator",text:"연설 평가자 호명",more:{examples:["Let me invite our first speech evaluator."]}},{who:"speech_evaluator",text:"연설 평가",time:"2–3분",flow:["좋았던 점","개선점","긍정적 마무리"],more:{tips:["프로젝트 목표를 기준으로 평가해요","타이머 카드: 초록 2:00 · 노랑 2:30 · 빨강 3:00"],examples:["I really liked how you opened with a question.","Next time, try pausing before your key point.","I'm looking forward to your next speech!"]}},{who:"timer",text:"타임 리포트 → 최우수 평가자 투표"}]},{id:"tabletopics",part:2,no:2,title:"Table Topics",sub:"즉흥 연설",time:"11:58",duration:"18분",lead:"Table Topics Master",color:"#93263f",icon:"zap",star:"즉흥 연설자 — 1~2분씩",lines:["진행 방식 설명 → 연설자 초대","게스트도 참여 가능","타임 리포트 → 투표"],steps:[{who:"table_topics",text:"진행 방식 · 목적 설명",more:{script:"table_topics"}},{who:"table_topics",text:"질문 → 즉흥 연설자 초대 (게스트 OK)",more:{tips:["역할이 없거나 발언이 적었던 분을 먼저 초대해요","게스트에게는 미리 참여 의사를 물어봐요"],examples:["Who would like to answer this one: What gift would you give your younger self?"]}},{who:"speaker",text:"즉흥 연설",time:"1–2분 (+30초)",more:{tips:["질문을 다시 말하고 → 내 답 한 가지 → 짧은 예시 순서로","타이머 카드: 초록 1:00 · 노랑 1:30 · 빨강 2:00"]}},{who:"timer",text:"타임 리포트 → 최우수 즉흥 연설자 투표"}]},{id:"evaluation2",part:2,no:3,title:"Evaluation 2",sub:"평가 세션 2",time:"12:16",duration:"10분",lead:"General Evaluator",color:"#a63c55",icon:"clipboard",lines:["Ah-Counter · Grammarian 보고","Hark Master 퀴즈","총평 · 3분 이내"],steps:[{who:"general_evaluator",text:"보고 요청"},{who:"ah_counter",text:"군말 보고",time:"1분 이내",more:{examples:['Today I counted 12 filler words in total. The most common one was "um."']}},{who:"grammarian",text:"표현 · 오늘의 단어 보고",time:"2분 이내",more:{tips:["좋은 표현 → 고칠 표현 → 오늘의 단어 사용 횟수"],examples:["Our word of the day was used 5 times today. Great job, everyone!"]}},{who:"hark_master",text:"연설 내용 퀴즈",time:"2분 이내",more:{examples:["Question one: What gift did our first speaker talk about?"]}},{who:"general_evaluator",text:"총평",time:"3분 이내",more:{tips:["진행 흐름 · 시간 관리 · 역할자 · 연설 평가자를 돌아봐요"],examples:["Overall, today's meeting ran smoothly and on time. One thing we can improve is..."]}}]},{id:"closing",part:2,no:4,title:"시상 · 폐회",sub:"Awards · Closing",time:"12:26",duration:"5+12분",lead:"Toastmaster → Chairperson",color:"#5c1225",icon:"trophy",lines:["시상 · 연설자·평가자·즉흥","게스트 소감 · 공지","롤 신청 → 폐회"],steps:[{who:"toastmaster",text:"시상",time:"5분",flow:["Best Table Topics Speaker","Best Speaker","Best Evaluator"],more:{examples:["And the Best Speaker award goes to... Congratulations!"]}},{who:"toastmaster",text:"의장에게 무대 넘기기"},{who:"chairperson",text:"게스트 소감 듣기",more:{examples:["Guests, how was today's meeting? We'd love to hear your thoughts."]}},{who:"vpe",text:"다음 모임 롤 신청 안내"},{who:"chairperson",text:"공지 → 폐회",more:{examples:["Thank you all for coming. This meeting is adjourned. See you next time!"]}}]}],la=[{id:"chairperson",official:{label:"Master Your Meetings",url:"https://www.toastmasters.org/1312"},en:"Chairperson",ko:"의장",icon:"gavel",color:"#0c3d5e",parts:"1부 · 2부",short:"개회·폐회, 게스트 소개, Free Speech 진행",subtitle:"모임을 열고 닫으며, 첫 세션과 마지막 세션을 진행합니다",duties:[{part:1,session:"opening",label:"Opening Session 진행 · 15분",tasks:[{title:"개회 · Mission 낭독할 사람 초대",mission:!0,examples:["Good morning, everyone! Welcome to today's meeting of Ilsan Standard Toastmasters. I'm your Chairperson today.","Who would like to recite the Toastmasters' Mission for us?"]},{title:"게스트 소개",examples:["We have some guests with us today. Could you briefly introduce yourself?"]},{title:"Free Speech 1 · 2 · 3 초대",time:"1–3분씩 · 전체 5분",examples:["Let's warm up with free speeches. Please welcome our first free speaker!"]},{title:"Toastmaster에게 무대 넘기기",examples:["Now I'll hand the stage over to today's Toastmaster."]}]},{part:2,session:"closing",label:"Closing 진행 · 12분",tasks:[{title:"게스트 소감 듣기",examples:["Guests, how was today's meeting? We'd love to hear your thoughts."]},{title:"공지 · 비즈니스 세션 (VPE 롤 신청 안내)",examples:["Now our VPE will help us sign up for roles for the next meeting."]},{title:"폐회",examples:["Thank you all for coming. This meeting is adjourned. See you next time!"]}]}],tip:{text:"의장은 모임의 시작과 끝을, 사회자(Toastmaster)는 그 사이 본 세션을 진행해요."}},{id:"toastmaster",official:{label:"Toastmaster Script and Log",url:"https://www.toastmasters.org/resources/toastmaster-script-and-log"},en:"Toastmaster",ko:"사회자",icon:"mic",color:"#7b1a31",parts:"1부 · 2부",short:"본 세션 진행, 역할자·연설자 소개, 시상",subtitle:"모임의 본 세션을 진행하며, 순서마다 다음 사람을 소개해 무대를 연결합니다",duties:[{part:1,session:"toastmasters",label:"Toastmasters Session 진행 · 15분",tasks:[{title:"사회자 인사 · 역할 설명",intro:["**Mr./Madam President, fellow Toastmasters, and guests.** Thank you for that wonderful introduction.","**As Toastmaster of the Day, it is my responsibility to introduce today’s speakers.** After the speeches have concluded, I will ask for the Timer’s report, request ballots be passed to the Vote Counter, introduce the General Evaluator, ask the Ah-Counter for their report, ask the Grammarian for their report, and call on the Vote Counter for results.","**I will then return control of the meeting to the President before we conclude today.**","**Thank you, Mr./Madam President.**"],introSource:"Toastmaster Script and Checklist · Item 675G",introNote:"ISTM에서는 President 대신 Chairperson(의장)이라고 부르면 돼요."},{title:"테마 질문 소개",examples:[`Today's theme is "Gift." Our theme question is: What is the most meaningful gift you've ever received?`]},{title:"역할자 소개",time:"1–2분씩",flow:["Timer","Ah-Counter","Hark Master","Grammarian","General Evaluator"],examples:["Let me invite our Timer to explain the role and answer the theme question."]}]},{part:1,session:"prepared",label:"Prepared Speech Session 진행 · 30분",tasks:[{title:"준비된 연설 목적 설명",examples:["In this session, members practice speeches from their Pathways projects."]},{title:"평가자에게 연설 목표 설명 요청",examples:["May I ask the evaluator to explain the speaker's project objectives?"]},{title:"연설자 소개",flow:["이름","제목","제목","이름"]},{title:"연설 후 1 Minute of Silence",time:"1분",examples:["Let's take one minute of silence so everyone can write feedback."]},{title:"타임 리포트 → 최우수 연설자 투표 → 쉬는 시간 안내",examples:["Timer, may we have your report?","Please vote for the Best Speaker. We'll now take a 10-minute break."]}]},{part:2,session:"closing",label:"Awards Session 진행 · 5분",tasks:[{title:"시상",flow:["Best Table Topics Speaker","Best Speaker","Best Evaluator"],examples:["And the Best Speaker award goes to... Congratulations!"]},{title:"의장에게 무대 넘기기",examples:["I'll now return the stage to our Chairperson."]}]}],tip:{text:"연설자 소개법: 이름 → 연설 제목 → 연설 제목 → 이름 순으로, 두 번씩 불러 주세요. 진행이 익숙하지 않다면 아젠다를 보며 진행해도 괜찮아요."}},{id:"timer",official:{label:"Timer Script and Log",url:"https://www.toastmasters.org/resources/timer-script-and-log"},en:"Timer",ko:"타이머",icon:"timer",color:"#1f7a4d",parts:"1부 · 2부",short:"시간 측정, 색깔 카드로 시간 안내",subtitle:"모든 순서의 시간을 재고, 무대 위 발표자에게 색깔 카드로 시간을 알려줍니다",duties:[{part:1,session:"opening",label:"Opening",tasks:[{title:"Free Speech 시간 측정",time:"1–3분"},{title:"워밍업 전체 5분 → 의장에게 알림",time:"5분"}]},{part:1,session:"toastmasters",label:"Toastmasters Session",tasks:[{title:"역할 설명 + 테마 질문 답변",time:"1–2분",intro:["**Greetings Mr./Madam Toastmaster, fellow Toastmasters, and guests.** **As Timer, I will time the Table Topics® speakers, formal speeches, and the evaluations.** I will also alert each speaker of the time they have left, **using the green, yellow, and red cards**, which denote specific times remaining.","**Table Topics Speakers should limit their remarks to no more than 2 minutes.** At 1 minute, I will raise the green card. At 1 minute and 30 seconds, I will raise the yellow card. At 2 minutes, I will raise the red card.","Those giving speeches should limit their remarks to their specific speech times. **Ice Breaker speeches should be 4-6 minutes in length.** At 4 minutes, I will raise the green card. At 5 minutes, I will raise the yellow card. At 6 minutes, I will raise the red card.","**Most other speeches should be 5-7 minutes in length.** At 5 minutes, I will raise the green card. At 6 minutes, I will raise the yellow card. At 7 minutes, I will raise the red card.","**The individual evaluations should be between 2-3 minutes.** At 2 minutes, I will raise the green card. At 2 minutes and 30 seconds, I will raise the yellow card. At 3 minutes, I will raise the red card.","**Thank you Mr./Madam Toastmaster.**"],introSource:"Timer Script and Log · Item 675E",introNote:"ISTM은 Free Speech(1–3분)와 역할자 소개(1–2분)도 재요."}]},{part:1,session:"prepared",label:"Prepared Speech",tasks:[{title:"연설마다 카드 표시"},{title:"1 Minute of Silence 측정 → 사회자에게 알림",time:"1분"},{title:"타임 리포트 → 최우수 연설자 투표 안내",examples:["Speaker one spoke for 6 minutes and 10 seconds, so qualified. Please vote for the Best Speaker."]}]},{part:2,session:"evaluation1",label:"Evaluation 1",tasks:[{title:"평가 시간 측정 · 타임 리포트 → 최우수 평가자 투표"}]},{part:2,session:"tabletopics",label:"Table Topics",tasks:[{title:"즉흥 연설 시간 측정 · 타임 리포트 → 최우수 즉흥 연설자 투표"}]}],blocks:[{kind:"timing"}]},{id:"ah_counter",official:{label:"Ah-Counter Script and Log",url:"https://www.toastmasters.org/resources/ah-counter-script-and-log"},en:"Ah-Counter",ko:"어지기",icon:"ear",color:"#c27c0e",parts:"1부 · 2부",short:"um, uh 같은 군말 횟수 세기",subtitle:"모임 중 나오는 불필요한 말버릇(군말)을 찾아 그 횟수를 세는 역할입니다",duties:[{part:1,session:"toastmasters",label:"Toastmasters Session",tasks:[{title:"역할 설명 + 테마 질문 답변",time:"1–2분",intro:["**Greetings Mr./Madam Toastmaster, fellow Toastmasters, and guests.** **The purpose of the Ah-Counter is to note words and sounds that are used as a “crutch” or “pause filler” by anyone who speaks.**","**During the meeting, I will listen for overused words, including and, well, but, so, and you know. I will also listen for filler sounds, including ah, um, and er.**","I will also note when a speaker repeats a word or phrase, such as “I, I” or “This means, this means.” **At the end of the meeting, I will report the number of times that each speaker used these expressions.**","**Thank you, Mr./Madam Toastmaster.**"],introSource:"Ah-Counter Script and Log · Item 675A",introNote:"ISTM에서는 한국어 군말(음, 어)도 함께 세요."}]},{part:2,session:"evaluation2",label:"Evaluation 2",tasks:[{title:"군말 보고 (누가 · 어떤 말 · 몇 번)",time:"1분 이내",examples:['Today I counted 12 filler words in total. The most common one was "um."']}]}],side:{title:"누구의 말을 듣나요?",tone:"tip",lines:["연설자뿐 아니라 의장, 사회자, 역할자, 평가자 등 발언하는 모든 사람의 말을 들어요."]},blocks:[{kind:"chips",title:"무엇을 세나요?",groups:[{label:"간투사",items:["um","uh","er","ah","음","어"]},{label:"반복되는 표현",items:["like","you know","so","well","actually"]}]}],tip:{text:"영어 군말과 함께 무심코 나오는 한국어 군말(음, 어)도 함께 세어 보세요."}},{id:"grammarian",official:{label:"Grammarian 역할 안내",url:"https://www.toastmasters.org/membership/club-meeting-roles/grammarian"},en:"Grammarian",ko:"어법지기",icon:"spell",color:"#6b3fa0",parts:"1부 · 2부",short:"잘못된 표현·좋은 표현·오늘의 단어 기록",subtitle:"모임 중 나온 잘못된 표현은 바로잡고, 좋은 표현은 다시 소개하는 역할입니다",duties:[{part:1,session:"toastmasters",label:"Toastmasters Session",tasks:[{title:"역할 설명 + 테마 질문 답변",time:"1–2분",intro:["**Mr./Madam Toastmaster, fellow Toastmasters, and guests. As Grammarian, it is my responsibility to pay close attention to all speakers, listening carefully to their language usage.** I’ll take note of any improper language, as well as any outstanding words, quotes, sayings, or thoughts. **As Grammarian, it is also my duty to introduce the Word of the Day.**","**For today’s meeting, the Word is ____, which means ____.**","**An example of using the word is: ____.**","**Each speaker is encouraged to use the Word of the Day.** I will give the Grammarian’s report when called upon during the meeting and also report on the usage of the Word of the Day.","**Thank you, Mr./Madam Toastmaster.**"],introSource:"Grammarian Script and Log · Item 675C",introNote:"빈칸(____)은 아젠다에 적힌 오늘의 단어로 채워요."},{title:"오늘의 단어 소개 (뜻 · 예문)",examples:[`Today's word is "priceless." It means extremely valuable. For example, "Time with my family is priceless."`]}]},{part:2,session:"evaluation2",label:"Evaluation 2",tasks:[{title:"표현 · 오늘의 단어 보고",time:"2분 이내",examples:["Our word of the day was used 5 times today. Great job, everyone!"]}]}],blocks:[{kind:"cards",title:"이 세 가지를 기록해요",items:[{icon:"warn",title:"잘못된 표현",text:"문법 오류",sub:"연설자 이름은 말하지 않아요"},{icon:"check",title:"좋은 표현",text:"인상 깊은 표현",sub:"이름 언급은 재량껏"},{icon:"trophy",title:"오늘의 단어",text:"누가 몇 번 썼는지",sub:"사용한 사람 & 횟수"}]}],tip:{text:"지적보다는 더 자연스러운 표현을 함께 알려 주는 방식이 좋아요."}},{id:"hark_master",official:{label:"ISTM 신입 회원 가이드",url:"reference/ISTM_New_Member_Guidebook_Korean.pdf"},en:"Hark Master",ko:"경청지기",icon:"help",color:"#0f7c86",parts:"1부 · 2부",short:"연설 내용으로 퀴즈를 내 경청 확인",subtitle:"모임에서 나온 연설을 잘 듣고, 그 내용으로 퀴즈를 내 회원들의 경청을 돕는 역할입니다",duties:[{part:1,session:"toastmasters",label:"Toastmasters Session",tasks:[{title:"역할 설명 + 테마 질문 답변 + 퀴즈 예고",time:"1–2분",intro:["Thank you, Toastmaster. Good morning, everyone.","**As today's Hark Master, I'll listen carefully to all the speeches today**: free speeches, prepared speeches, and Table Topics.","**In the second evaluation session, I'll ask you some quiz questions about what you heard.**","**So please listen carefully!**"],introSource:"ISTM 예시 (공식 스크립트 없는 클럽 역할)"}]},{part:2,session:"evaluation2",label:"Evaluation 2",tasks:[{title:"퀴즈 내기 → 손 든 사람이 답하기",time:"2분 이내",examples:["Question one: What gift did our first speaker talk about?"]},{title:"정답 + 연설 포인트 짚기"}]}],side:{title:"모임 내내 할 일",tone:"plain",list:["모든 연설을 들으며 메모","핵심 메시지 · 사례 · 숫자로 질문 만들기"]},tip:{text:"질문은 여러 연설자에게 고르게, 사소한 내용보다 연설의 핵심을 떠올리게 하는 질문이 좋아요."}},{id:"free_speech",en:"Free Speech",ko:"연설자",icon:"megaphone",color:"#d0602a",parts:"1부",short:"1~3분 자유 주제 워밍업 연설",subtitle:"모임 초반, 1~3분 동안 자유 주제로 말하며 모임 분위기를 여는 워밍업 연설입니다",duties:[{part:1,session:"opening",label:"Opening · Warm-up",tasks:[{title:"의장의 소개를 받고 연설",time:"1–3분",examples:["Hello, everyone. Today I'd like to share a small story from my weekend."]}]}],side:{title:"준비",tone:"plain",kv:[["롤 신청","지난 모임 폐회 때"],["주제","자유 (요즘 일, 생각, 추천)"],["메시지","하나로 좁히기"],["인원","Free Speech 1 · 2 · 3"]]},tip:{text:"패스웨이 프로젝트는 아니지만 무대에 서는 연습으로 아주 좋아요. 처음 연설하는 회원에게 특히 추천해요!"}},{id:"table_topics",official:{label:"Topicsmaster Script and Log",url:"https://www.toastmasters.org/resources/topicsmaster-script-and-log"},en:"Table Topics Master",ko:"즉흥 연설 진행자",icon:"zap",color:"#b8336a",parts:"2부",short:"즉흥 질문 준비, 연설자 초대",subtitle:"즉흥 연설(Table Topics Speech) 세션을 맡아 질문을 준비하고, 연설자를 무대로 초대합니다",duties:[{part:2,session:"tabletopics",label:"Table Topics Session 진행 · 18분",tasks:[{title:"진행 방식 · 목적 설명",intro:["**Greetings Mr./Madam Toastmaster, fellow Toastmasters, and guests.** **The purpose of the Topicsmaster is to facilitate Table Topics®, where guests and members will have the opportunity to practice their impromptu speaking.**","**I will introduce a topic and call on speakers**, who will be given two minutes to speak on the subject.","**Thank you Mr./Madam Toastmaster.**"],introSource:"Topicsmaster Script and Log · Item 675F",introNote:"ISTM은 1–2분(+30초)이에요."},{title:"질문 → 연설자 초대",time:"1–2분 (+30초)",examples:["Who would like to answer this one: What gift would you give your younger self?"]},{title:"타임 리포트 → 최우수 즉흥 연설자 투표"}]}],side:{title:"미리 준비할 것",tone:"plain",list:["즉흥 연설 질문 여러 개","가급적 모임 테마와 연결"]},tip:{text:"그날 역할이 없거나 발언이 적었던 분을 먼저 초대해 주세요. 게스트도 참여할 수 있어요!"}},{id:"general_evaluator",official:{label:"General Evaluator Checklist",url:"https://www.toastmasters.org/resources/general-evaluator-checklist"},en:"General Evaluator",ko:"총평가자",icon:"clipboard",color:"#3949ab",parts:"1부 · 2부",short:"평가 세션 진행, 모임 전체 평가",subtitle:"두 번의 평가 세션을 진행하고, 모임 전체(진행, 역할자, 준비 등)를 돌아보고 평가합니다",duties:[{part:1,session:"toastmasters",label:"Toastmasters Session",tasks:[{title:"역할 설명 + 테마 질문 답변",time:"1–2분",intro:["**Greetings Mr./Madam Toastmaster, fellow Toastmasters, and guests.** **The purpose of the General Evaluator is to evaluate everything that takes place throughout the meeting.**","During the meeting, I will take notes on everything that happens and doesn’t happen. I will evaluate each participant on the meeting program and look for good examples of preparation, organization, delivery, enthusiasm, observation, and performance of duties.","**At the end of the meeting, I will give my report.**","**Thank you, Mr./Madam Toastmaster.**"],introSource:"General Evaluator Checklist · Item 675B"}]},{part:2,session:"evaluation1",label:"Evaluation 1 진행 · 15분",tasks:[{title:"연설 평가자 호명",time:"2–3분씩",examples:["Let me invite our first speech evaluator."]},{title:"타임 리포트 → 최우수 평가자 투표"}]},{part:2,session:"evaluation2",label:"Evaluation 2 진행 · 10분",tasks:[{title:"보고 요청",flow:["Ah-Counter 1분","Grammarian 2분","Hark Master 퀴즈"],examples:["May I have the Ah-Counter's report, please?"]},{title:"총평",time:"3분 이내",examples:["Overall, today's meeting ran smoothly and on time. One thing we can improve is..."]}]}],side:{title:"무엇을 평가하나요?",tone:"plain",list:["진행 흐름","시간 관리","역할자","모임 준비","연설 평가자"]},tip:{text:"총평가자는 연설자를 평가하지 않아요. 그건 연설 평가자의 몫! 대신 연설 평가자에 대한 평가는 할 수 있어요.",warn:!0}},{id:"speech_evaluator",official:{label:"A Toastmaster Wears Many Hats",url:"https://ccdn.toastmasters.org/medias/files/pathways/toastmaster-wears-many-hats/1167d-a-toastmaster-wears-many-hats.pdf"},en:"Speech Evaluator",ko:"연설 평가자",icon:"message",color:"#1d6fb8",parts:"1부 · 2부",short:"준비된 연설을 평가해 성장 돕기",subtitle:"평가지를 바탕으로, 연설자가 다음 연설을 더 잘할 수 있도록 돕는 역할입니다",duties:[{part:1,session:"prepared",label:"Prepared Speech",tasks:[{title:"연설 목적 · 프로젝트 · 시간 소개",examples:["Today's speaker is working on Effective Body Language. The goal is to use gestures that support the message."]},{title:"연설 들으며 평가지 메모"},{title:"1 Minute of Silence에 평가 정리",time:"1분"}]},{part:2,session:"evaluation1",label:"Evaluation 1",tasks:[{title:"평가 발표",time:"2–3분",flow:["좋았던 점","개선점","긍정적 마무리"],examples:["I really liked how you opened with a question.","Next time, try pausing before your key point.","I'm looking forward to your next speech!"]}]}],side:{title:"미리 준비할 것",tone:"plain",list:["연설자에게 평가받고 싶은 점 묻기","해당 프로젝트 평가지 (Resources)"]},blocks:[{kind:"structure",title:"추천 평가 구조",items:[{title:"좋았던 점",text:"구체적으로 칭찬"},{title:"개선점",text:"다음에 시도할 한 가지"},{title:"긍정적 마무리",text:"응원으로 끝맺기"}]}],tip:{text:"무엇을 말하느냐만큼 어떻게 말하느냐가 중요해요. (어투, 피드백의 강도 등)"}}],Lh={chairperson:"Chairperson",toastmaster:"Toastmaster",timer:"Timer",ah_counter:"Ah-Counter",grammarian:"Grammarian",hark_master:"Hark Master",free_speech:"Free Speech",table_topics:"Table Topics Master",general_evaluator:"General Evaluator",speech_evaluator:"Speech Evaluator",speaker:"연설자",vpe:"VPE",all:"모두"},Rf=[["Free Speech","1:00","2:00","3:00","1:00 – 3:00"],["역할자 소개","1:00","1:30","2:00","1:00 – 2:00"],["Ice Breaker","4:00","5:00","6:00","3:30 – 6:30"],["준비된 연설","5:00","6:00","7:00","4:30 – 7:30"],["연설 평가","2:00","2:30","3:00","1:30 – 3:30"],["즉흥 연설","1:00","1:30","2:00","1:00 – 2:30"]],Gn={facts:[["프로젝트","Pathways 1-1"],["시간","4–6분"],["합격","3:30 – 6:30"],["준비물","평가지"]],steps:[{title:"원고 작성 & 연습",text:"나를 알릴 이야기라면 무엇이든"},{title:"연설 당일",text:"평가지를 연설 평가자에게 전달"}],tip:"자기소개 연설은 PPT 없이 해 보는 것을 추천해요. PPT를 쓰는 연설과 오롯이 '나'를 활용하는 연설은 다른 기술이에요."},yh={label:"평가 시트 (공통)",file:"8053_Generic_Evaluation_Resource.pdf"},ht={items:[{code:"1-1",kind:"연설",ko:"자기소개",en:"Ice Breaker",text:"나를 소개하고 현재 연설 실력 확인",time:"4–6분",pass:"3:30 – 6:30",sheet:yh,link:"icebreaker"},{code:"1-2",kind:"연설",ko:"목적을 가지고 연설문 쓰기",en:"Writing a Speech with Purpose",text:"큰 목표와 구체적 메시지 정하기",time:"5–7분",pass:"4:30 – 7:30",sheet:yh},{code:"1-3",kind:"연설",ko:"목소리 변화와 몸짓 언어 입문",en:"Introduction to Vocal Variety and Body Language",text:"목소리 · 몸짓 활용",time:"5–7분",pass:"4:30 – 7:30",sheet:yh}],evaluation:{code:"1-4",ko:"평가와 피드백",en:"Evaluation and Feedback",text:"연설 2번 + 평가 1번을 한 묶음으로 해요",steps:[{code:"1-4 ①",kind:"연설",ko:"첫 번째 연설 & 평가 받기",en:"First Speech",text:"자유 주제로 연설하고 평가받기",time:"5–7분",pass:"4:30 – 7:30",sheet:{label:"첫 번째 연설 평가 시트",file:"8100E1_Evaluation_and_Feedback_First_Speech.pdf"}},{code:"1-4 ②",kind:"연설",ko:"평가를 반영해 두 번째 연설",en:"Second Speech",text:"가급적 첫 번째와 같은 연설로",time:"5–7분",pass:"4:30 – 7:30",sheet:{label:"두 번째 연설 평가 시트",file:"8100E2_Evaluation_and_Feedback_Second_Speech.pdf"}},{code:"1-4 ③",kind:"평가",ko:"다른 연설자 평가하기",en:"Evaluator Speech",text:"내가 연설 평가자가 되어 평가 발표",time:"2–3분",pass:"1:30 – 3:30",sheet:{label:"평가자 평가 시트",file:"8100E3_Evaluation_and_Feedback_Evaluator_Speech.pdf"}}]},done:"연설 5번 + 평가 1번",doneNote:"1-1 · 1-2 · 1-3 · 1-4① · 1-4② 연설 + 1-4③ 평가",baseCamp:[{title:"로그인",text:"회원 신청서에 적은 이메일로"},{title:"Learning Hub",text:"My Home에서 열기"},{title:"Choose Path",text:"경로를 골라요"},{title:"Level 1 시작",text:"첫 프로젝트 확인"}]},T3={"8100E1_Evaluation_and_Feedback_First_Speech.pdf":"https://ccdn.toastmasters.org/medias/files/department-documents/education-documents/evaluation-resources/english/8100e1-evaluation-resource-first-speech.pdf","8100E2_Evaluation_and_Feedback_Second_Speech.pdf":"https://ccdn.toastmasters.org/medias/files/department-documents/education-documents/evaluation-resources/english/8100e2-evaluation-resource-second-speech.pdf","8100E3_Evaluation_and_Feedback_Evaluator_Speech.pdf":"https://ccdn.toastmasters.org/medias/files/department-documents/education-documents/evaluation-resources/english/8100e3-evaluation-resource-evaluator-speech.pdf","8203E_Effective_Body_Language.pdf":"https://ccdn.toastmasters.org/medias/files/department-documents/education-documents/evaluation-resources/english/8203e-evaluation-resource-ffe.pdf","8206E_Understanding_Your_Communication_Style.pdf":"https://www.toastmasters.org/resources/resource-library?t=8206","8053_Generic_Evaluation_Resource.pdf":"https://content.toastmasters.org/image/upload/8053-generic-evaluation-resource.pdf"},Sh=(e)=>T3[e]??`/evaluation-sheets/${e}`;var lb=[{id:"istm_flow",priority:2,terms:["처음 모임에 가면 어떤 순서로 진행돼","모임 진행 순서","모임 흐름","신입회원 학습","회의 순서","모임 순서"],answer:`ISTM 신입회원 가이드의 예시는 모임을 1부와 2부로 나눕니다. 1부는 의장(Chairperson)의 개회와 게스트 소개, 자유 연설(Free Speech), 사회자(Toastmaster)의 역할·주제 소개, 준비 연설(Prepared Speech), 휴식(Intermission)으로 이어집니다. 2부는 연설 평가(Evaluation), 즉흥 연설(Table Topics), 두 번째 평가 세션, 시상(Awards)과 폐회(Closing) 순서예요. 예시 시간표이므로 실제 순서와 시간은 클럽마다 달라질 수 있습니다.

먼저 기억할 점: 누가 어느 세션을 진행하는지와 내가 맡은 역할을 시작 전에 확인하세요.`,source:"ISTM 신입회원 가이드, 2–3쪽",topic:"new_member",nexts:["의장(Chairperson)과 사회자(Toastmaster)는 어떻게 달라?","신입회원은 어떤 역할부터 맡으면 좋고, 각 역할은 무엇을 해?"]},{id:"istm_chairperson",priority:2,terms:["의장 chairperson","chairperson 의장","chairperson","toastmaster","의장과 사회자","사회자와 의장","chairperson 역할","의장 역할"],answer:`의장(Chairperson)은 모임의 시작과 끝을 맡고, 1부 개회 세션(Opening Session)과 2부 폐회 세션(Closing)을 진행합니다. 개회, 토스트마스터즈 미션 낭독, 게스트 소개와 자유 연설자 초대가 주요 역할이에요.

사회자(Toastmaster)는 그 사이의 본 세션을 맡아 주제와 역할자를 소개하고 준비 연설을 진행합니다. 간단히 말하면 의장은 모임의 문을 열고 닫고, 사회자는 본 세션의 흐름을 이어 줍니다.`,source:"ISTM 신입회원 가이드, 4–5쪽",topic:"roles",nexts:["사회자(Toastmaster)는 준비 연설 세션에서 무엇을 해?","시간지기(Timer)는 어떤 일을 해?"]},{id:"istm_roles_overview",priority:2,terms:["신입회원은 어떤 역할부터 맡으면 좋고","역할 한눈에","역할 종류","모임 역할 전체","역할자 종류","역할 설명"],answer:`가이드는 역할을 한국어(English term)로 이렇게 소개합니다.
• 의장(Chairperson): 개회·폐회와 게스트 소개
• 사회자(Toastmaster): 본 세션과 발표자 진행
• 시간지기(Timer): 시간 측정과 색깔 신호
• 어지기(Ah-Counter): 군말·간투사 횟수 기록
• 어법지기(Grammarian): 좋은 표현·문법과 오늘의 단어 기록
• 경청지기(Hark Master): 연설을 듣고 내용 퀴즈 진행
• 자유 연설자(Free Speech Speaker): 1–3분 워밍업 연설
• 즉흥 연설 진행자(Table Topics Master): 질문 준비와 발표자 초대
• 총평가자(General Evaluator): 평가 세션과 모임 전체 돌아보기
• 연설 평가자(Speech Evaluator): 준비 연설에 성장 피드백 제공

처음에는 시간지기나 어지기처럼 역할 지침이 구체적인 역할부터 맡고, 담당 임원에게 준비 방법을 확인하면 좋아요. 역할 배정은 클럽 운영 방식에 따라 다를 수 있습니다.`,source:"ISTM 신입회원 가이드, 3쪽 및 6–13쪽",topic:"roles",nexts:["시간지기(Timer)는 어떤 일을 해?","어지기(Ah-Counter)는 누구의 말을 기록해?"]},{id:"istm_toastmaster",priority:2,terms:["사회자 toastmaster","사회자 역할","준비 연설 사회자","toastmaster 역할"],answer:"사회자(Toastmaster)는 본 세션을 이끌며 역할자와 발표자를 소개하고 무대의 흐름을 연결합니다. 먼저 주제와 역할자를 안내하고, 준비 연설(Prepared Speech) 세션에서는 각 연설의 목적과 평가 목표를 소개한 뒤 발표자를 정해진 순서로 초대합니다. 연설 사이에는 1분간 조용히 돌아보는 시간을 두고, 시간 보고와 최우수 연설자 투표를 안내합니다. 시상 세션(Awards Session)을 진행한 뒤 폐회는 의장(Chairperson)에게 넘깁니다.",source:"ISTM 신입회원 가이드, 5쪽",topic:"roles",nexts:["연설 평가자(Speech Evaluator)는 어떻게 피드백해?","총평가자(General Evaluator)는 무엇을 평가해?"]},{id:"istm_timer",priority:2,terms:["시간지기 timer","timer 시간지기","타이머 색깔","시간지기 역할","초록 노랑 빨강","시간 신호"],answer:`시간지기(Timer)는 모임 순서의 시간을 재고, 발표자에게 초록·노랑·빨강 카드를 보여 줍니다. 가이드의 신호 기준은 다음과 같습니다.
• 자유 연설(Free Speech): 1분 초록, 2분 노랑, 3분 빨강; 허용 시간 1–3분
• 역할자 소개(Role Introduction): 1분 초록, 1분 30초 노랑, 2분 빨강; 허용 시간 1–2분
• 자기소개 첫 연설(Ice Breaker): 4분 초록, 5분 노랑, 6분 빨강; 허용 시간 3분 30초–6분 30초
• 준비 연설(Prepared Speech): 5분 초록, 6분 노랑, 7분 빨강; 허용 시간 4분 30초–7분 30초
• 연설 평가(Evaluation): 2분 초록, 2분 30초 노랑, 3분 빨강; 허용 시간 1분 30초–3분 30초
• 즉흥 연설(Table Topics Speech): 1분 초록, 1분 30초 노랑, 2분 빨강; 허용 시간 1–2분 30초

시작 전에 해당 연설의 시간 기준을 확인하고, 신호 장비도 점검하세요. 이 수치는 ISTM 가이드의 예시이며 클럽 규정이나 프로젝트 기준이 다르면 담당자에게 확인해야 합니다.`,source:"ISTM 신입회원 가이드, 6쪽",topic:"roles",nexts:["어지기(Ah-Counter)는 누구의 말을 기록해?","어법지기(Grammarian)는 무엇을 기록해?"]},{id:"istm_ah_counter",priority:2,terms:["어지기 ah-counter","ah counter 어지기","어지기 역할","군말 기록","간투사","um uh"],answer:`어지기(Ah-Counter)는 연설자만이 아니라 의장, 사회자, 역할자와 평가자를 포함해 말하는 모든 사람의 불필요한 군말을 듣고 횟수를 기록합니다. 예를 들면 ‘음’, ‘어’, um, uh, er, ah와 습관적으로 반복되는 like, you know 같은 표현이에요. 평가 세션 2에서 어떤 표현이 누구에게 몇 번 나왔는지 보고합니다.

목적은 창피를 주는 것이 아니라 말버릇을 알아차리고 연습하도록 돕는 것입니다.`,source:"ISTM 신입회원 가이드, 7쪽",topic:"roles",nexts:["어법지기(Grammarian)는 무엇을 기록해?","경청지기(Hark Master)는 어떤 퀴즈를 내?"]},{id:"istm_grammarian",priority:2,terms:["어법지기 grammarian","grammarian 어법지기","어법지기 역할","오늘의 단어","word of the day"],answer:"어법지기(Grammarian)는 잘못된 문법이나 표현을 기록하고, 인상 깊고 좋은 표현도 함께 모읍니다. 오늘의 단어(Word of the Day)를 뜻과 예문과 함께 소개해 모든 사람이 써 보도록 권합니다. 평가 세션 2에서는 문법·어휘 사례와 오늘의 단어 사용을 보고합니다. 가이드는 지적보다 더 자연스러운 표현을 함께 제안하는 방식을 권합니다.",source:"ISTM 신입회원 가이드, 8쪽",topic:"roles",nexts:["경청지기(Hark Master)는 어떤 퀴즈를 내?","총평가자(General Evaluator)는 무엇을 평가해?"]},{id:"istm_hark_master",priority:2,terms:["경청지기 hark master","hark master 경청지기","경청지기 역할","경청 퀴즈","연설 내용 퀴즈"],answer:"경청지기(Hark Master)는 준비 연설(Prepared Speech), 자유 연설(Free Speech), 즉흥 연설(Table Topics Speech)을 들으며 핵심 내용을 메모합니다. 연설의 메시지나 인상적인 사례·숫자·단어에 관한 질문을 준비하고, 모임 중 회원들에게 퀴즈를 냅니다. 정답을 확인한 뒤 연설의 핵심을 짧게 되짚어 주세요. 질문은 연설자에게 골고루 기회를 주고, 사소한 정보보다 핵심 메시지를 떠올리게 하는 것이 좋습니다.",source:"ISTM 신입회원 가이드, 9쪽",topic:"roles",nexts:["즉흥 연설 진행자(Table Topics Master)는 어떻게 진행해?","자유 연설(Free Speech)은 준비 연설과 뭐가 달라?"]},{id:"istm_free_speech",priority:2,terms:["자유 연설 free speech","free speech 자유 연설","워밍업 연설","자유 연설 역할","자유 연설 시간"],answer:"자유 연설(Free Speech)은 모임 초반 분위기를 여는 1–3분의 워밍업 연설입니다. 다음 모임의 역할 신청 때 자유 연설 자리에 이름을 올리고, 최근 있었던 일이나 생각·추천처럼 말하고 싶은 주제를 한 가지 정해 의장(Chairperson)의 소개를 받은 뒤 자연스럽게 마무리하세요. 가이드 예시에서는 모임당 세 명이 차례로 발표합니다. Pathways 프로젝트 연설은 아니지만, 처음 무대에 서는 회원이 연습하기 좋은 기회입니다.",source:"ISTM 신입회원 가이드, 10쪽",topic:"speeches",nexts:["첫 연설 자기소개(Ice Breaker)는 어떻게 준비해?","연설 평가자(Speech Evaluator)는 어떻게 피드백해?"]},{id:"istm_table_topics",priority:2,terms:["즉흥 연설 진행자 table topics master","table topics master","table topics 진행","즉흥 연설 질문","즉흥 연설 시간"],answer:"즉흥 연설 진행자(Table Topics Master)는 모임 주제와 연결되는 질문을 미리 준비하고 세션의 목적과 시간을 설명한 뒤 발표자를 초대합니다. 가이드에서는 즉흥 연설(Table Topics Speech)을 1–2분(30초 여유 포함)으로 안내합니다. 남은 시간을 보고 질문 수와 발표자 수를 조절하고, 그날 다른 역할이 없거나 발언 기회가 적었던 회원을 먼저 초대해 주세요. 게스트 참여는 의사를 확인하고 존중합니다.",source:"ISTM 신입회원 가이드, 11쪽",topic:"roles",nexts:["총평가자(General Evaluator)는 무엇을 평가해?","연설 평가자(Speech Evaluator)는 어떻게 피드백해?"]},{id:"istm_general_evaluator",priority:2,terms:["총평가자 general evaluator","general evaluator 총평가자","총평가자 역할","평가 세션 순서","회의 전체 평가"],answer:"총평가자(General Evaluator)는 두 차례 평가 세션을 진행하고 모임 전체의 흐름·시간 관리·역할 수행·준비를 돌아봅니다. 첫 평가 세션에서는 연설 평가자(Speech Evaluator)를 한 명씩 소개하고 각 연설 평가 뒤 시간 보고와 우수 평가자 투표를 안내합니다. 두 번째 세션에서는 어지기(Ah-Counter) 보고, 어법지기(Grammarian) 보고, 경청지기(Hark Master) 퀴즈 순으로 진행한 뒤 3분 이내로 총평합니다. 총평가자는 연설자 자체를 평가하지 않습니다. 연설 평가는 연설 평가자의 역할입니다.",source:"ISTM 신입회원 가이드, 12쪽",topic:"roles",nexts:["연설 평가자(Speech Evaluator)는 어떻게 피드백해?","첫 연설 자기소개(Ice Breaker)는 어떻게 준비해?"]},{id:"istm_speech_evaluator",priority:2,terms:["연설 평가자 speech evaluator","speech evaluator 연설 평가자","연설 평가자 역할","평가 피드백 방법","좋았던 점 개선점"],answer:"연설 평가자(Speech Evaluator)는 발표자의 인격이 아니라 이번 프로젝트에서 연설자가 세운 목표와 실제 발표를 기준으로 피드백합니다. 가이드가 권하는 구조는 세 단계예요. 1) 좋았던 점을 구체적으로 칭찬하기, 2) 다음에 시도할 개선점을 제안하기, 3) 응원으로 긍정적으로 마무리하기. 평가 전에 연설자에게 받고 싶은 피드백을 물어보고 프로젝트 평가 기준도 확인하세요. 내용뿐 아니라 전달 방법도 살펴봅니다.",source:"ISTM 신입회원 가이드, 13쪽",topic:"roles",nexts:["첫 연설 자기소개(Ice Breaker)는 어떻게 준비해?","Pathways 레벨 1은 어떤 순서로 진행돼?"]},{id:"istm_ice_breaker",priority:2,terms:["첫 연설 자기소개 ice breaker","ice breaker 첫 연설","자기소개 연설","첫 연설 준비","아이스브레이커"],answer:`첫 연설인 자기소개 연설(Ice Breaker)은 나를 소개하고 현재 연설 실력을 점검하는 기회입니다. 가이드의 Pathways 프로젝트 1-1 기준 발표 시간은 4–6분(허용 시간 3분 30초–6분 30초)입니다.

준비 순서는 ① 망설이지 말고 다음 모임 역할을 신청하기, ② 교육 부회장(VPE)에게 프로젝트 안내 매뉴얼 받기, ③ 나를 잘 보여 주는 이야기를 골라 원고를 쓰고 연습하기, ④ 연설 당일 평가지를 준비해 연설 평가자에게 전달하기입니다. 가이드는 PPT 없이 말해 보는 방식을 권합니다. 개인적인 경험과 생각을 담아도 괜찮습니다.`,source:"ISTM 신입회원 가이드, 14–15쪽",topic:"speeches",nexts:["Pathways 레벨 1은 어떤 순서로 진행돼?","연설 평가자(Speech Evaluator)는 어떻게 피드백해?"]},{id:"istm_pathways_level1",priority:2,terms:["pathways 레벨 1은 어떤 순서","pathways level 1","레벨 1 흐름","레벨1 프로젝트","1-1 1-2 1-3 1-4"],answer:`ISTM 신입회원 가이드의 Pathways 레벨 1 예시는 네 프로젝트로 구성됩니다.
• 1-1 자기소개 연설(Ice Breaker): 나를 소개하고 현재 실력 확인, 연설 1회
• 1-2 목적을 가지고 연설문 쓰기(Writing a Speech with Purpose): 분명한 목표와 구체적인 메시지, 연설 1회
• 1-3 목소리 변화와 몸짓 언어 입문(Introduction to Vocal Variety and Body Language): 목소리·몸짓 활용, 연설 1회
• 1-4 평가와 피드백(Evaluation and Feedback): 피드백을 반영한 연설과 다른 회원 연설 평가

1-4는 첫 연설과 평가를 받은 뒤 피드백을 반영한 두 번째 연설을 하고, 다른 연설자를 평가하는 세 단계로 소개돼요. 이 가이드의 완료 예시는 연설 5회와 연설 평가 1회입니다. 실제 프로젝트 요구사항은 본인의 Pathways 화면과 프로젝트 안내를 우선 확인하세요.`,source:"ISTM 신입회원 가이드, 15쪽",topic:"pathways",nexts:["자기소개 연설(Ice Breaker)은 어떤 내용을 말하면 좋아?","연설 평가자(Speech Evaluator)는 어떻게 피드백해?"]},{id:"en_manual_inventory",priority:1,terms:["영어 매뉴얼","영어 메뉴얼","영어 자료","추가된 매뉴얼","추가한 자료","database","데이터베이스","무슨 매뉴얼","어떤 매뉴얼","영어 원문"],answer:"영어 공식 문서 5종을 검색 자료에 반영했습니다: A Toastmaster Wears Many Hats(1167D), Distinguished Club Program(1111, 2026년 6월 개정), Club Leadership Handbook(1310, 2026년 6월 개정), Master Your Meetings(1312, 2026년 6월 개정), Club Success Plan(1111CSP). 역할 수행, 모임 구성, 임원 책임, DCP 목표, 계획 수립 질문에 사용할 수 있습니다.",source:"Toastmasters 공식 영어 PDF 5종; 목록과 개정 표기는 지식베이스 자료 목록 참조",topic:"manuals"},{id:"en_roles_overview",priority:1,terms:["회의 역할","모임 역할 종류","meeting roles","역할 설명","역할이 뭐","역할은 뭐","club meeting role"],answer:"영어 역할 안내서는 연설자, 연설 평가자, 타이머, Topicsmaster(Table Topics 진행자), Table Topics 발표자, General Evaluator(회의 전반 평가자), Toastmaster(회의 진행자), Grammarian(언어·오늘의 단어 담당), Ah-Counter(군더더기 말 기록), Introducer(연설자 소개) 역할을 설명합니다. 어떤 역할을 맡았는지 알려주시면 준비 순서와 모임 중 할 일을 정리해 드릴게요.",source:"A Toastmaster Wears Many Hats (1167D, Rev. 12/2020), pp. 2–12",topic:"roles"},{id:"en_speaker",priority:1,terms:["연설자 역할","스피커 역할","speech 준비","연설 준비","발표 준비","연설할 때","speaker"],answer:"연설자는 일정을 확인하고, 조사·구성·리허설에 충분한 시간을 둬 준비합니다. Pathways 프로젝트 연설이면 프로젝트 체크리스트를 확인하고, 평가자와 프로젝트·연설 내용·피드백 받고 싶은 점을 미리 상의하세요. 모임 전에 마이크·조명·소품을 점검하고, 평가를 들은 뒤 기록된 피드백을 확인합니다.",source:"A Toastmaster Wears Many Hats (1167D, Rev. 12/2020), pp. 2–3",topic:"roles"},{id:"en_evaluator",priority:1,terms:["평가자 역할","연설 평가","평가 피드백","평가할 때","evaluator","평가 어떻게"],answer:"평가 전에는 발표자와 프로젝트 및 평가 기준을 확인하고, 발표자가 받고 싶은 피드백을 물어봅니다. 평가할 때는 잘된 점을 구체적으로 짚고, 개선점에는 실행 가능한 제안을 붙입니다. 구두 평가는 격려로 시작하고 마무리하며, 사람의 성격보다 발표에서 관찰한 기술과 행동에 초점을 둡니다. 안내서의 척도에서 3은 기대 수준 충족, 4–5는 그 이상을 나타냅니다.",source:"A Toastmaster Wears Many Hats (1167D, Rev. 12/2020), pp. 3–4",topic:"roles"},{id:"en_timer",priority:1,terms:["타이머 역할","시간 측정","시간 신호","timer","녹색 노란색 빨간색","타임키퍼"],answer:"타이머는 각 발표의 배정 시간을 발표자와 미리 확인하고, 모임 시작 때 시간 규칙과 신호 장치를 설명합니다. 모임 중에는 클럽 규정에 맞춰 신호를 보내고 발표자별 실제 시간을 기록해 요청받을 때 보고합니다. 신호 장비를 점검하고 모임 후 Sergeant at Arms에게 돌려주세요. 색상별 세부 시간 규칙은 클럽 정책과 해당 연설 프로젝트 지침을 따르세요.",source:"A Toastmaster Wears Many Hats (1167D, Rev. 12/2020), pp. 5–6",topic:"roles"},{id:"en_topicsmaster",priority:1,terms:["topicsmaster","테이블 토픽","table topics 진행","즉흥연설 주제","토픽마스터","토픽 마스터"],answer:"Topicsmaster는 회의 주제와 맞는 독창적인 Table Topics 질문을 준비하고, 이미 역할이 있는 사람보다 다른 회원에게 먼저 발언 기회를 주도록 순서를 계획합니다. 시작할 때 목적과 시간 제한을 설명하고 질문을 짧게 제시해 참가자를 부릅니다. 세션 시간에 맞춰 질문 수를 조정하고, 게스트는 사전에 참여 의사를 확인한 경우에만 지명합니다.",source:"A Toastmaster Wears Many Hats (1167D, Rev. 12/2020), pp. 6–7; Master Your Meetings (1312, Rev. 06/2026), pp. 25–26",topic:"roles"},{id:"en_table_topics_speaker",priority:1,terms:["테이블 토픽 답변","즉흥연설 답변","테이블 토픽 발표자","table topics speaker","즉석 답변"],answer:"Table Topics 답변은 짧고 주제에 맞게 구성하세요. 막막하면 의견을 먼저 말하고 이유 2~3개를 덧붙이거나, 문제와 원인을 설명한 뒤 해결 방향을 제시할 수 있습니다. 이전 발언을 듣고 이어 말하면 대화와 연결되고, 클럽에서 정한 발표 시간과 장소 규칙을 따르세요.",source:"Master Your Meetings (1312, Rev. 06/2026), pp. 25–26; A Toastmaster Wears Many Hats (1167D), p. 7",topic:"roles"},{id:"en_general_evaluator",priority:1,terms:["general evaluator","종합 평가자","전체 평가자","회의 평가자","일반 평가자"],answer:"General Evaluator는 회의 전체와 평가팀을 살펴봅니다. 사전에 Toastmaster와 순서·변경 사항을 확인하고 평가자들과 배정을 조율합니다. 회의 중에는 준비, 전달, 역할 수행, 시간 준수와 개선 기회를 기록합니다. 평가 순서에서 각 평가자를 소개하고, 구체적이고 격려하는 종합 피드백을 한 뒤 진행을 Toastmaster에게 돌려줍니다.",source:"A Toastmaster Wears Many Hats (1167D, Rev. 12/2020), pp. 8–9",topic:"roles"},{id:"en_toastmaster",priority:1,terms:["toastmaster 역할","회의 진행자","오늘의 토스트마스터","toastmaster of the day","사회 역할","회의 사회"],answer:"Toastmaster는 회의 전체를 조정하고 참가자를 소개하며 따뜻한 진행 분위기를 만듭니다. 사전에 VPE와 역할·발표자 명단, 회의 주제를 확인하고, Topicsmaster·General Evaluator 및 발표자들과 내용을 조율합니다. 당일에는 순서를 지키고 전환을 매끄럽게 하며 발표와 평가를 소개하고, 타이머 보고와 공지·시상을 진행한 뒤 회의를 정시에 마칠 수 있도록 합니다.",source:"A Toastmaster Wears Many Hats (1167D, Rev. 12/2020), pp. 9–10",topic:"roles"},{id:"en_grammarian",priority:1,terms:["grammarian","문법 담당","그래머리언","오늘의 단어","word of the day","문법 역할"],answer:"Grammarian은 일상 대화에 쓸 만한 오늘의 단어를 정하고 품사·뜻·예문을 준비합니다. 회의에서 단어를 소개한 뒤 회원의 표현과 문법, 단어 사용 사례를 기록합니다. 보고할 때는 개선 사례뿐 아니라 창의적 표현과 단어를 적절히 사용한 회원도 함께 언급합니다.",source:"A Toastmaster Wears Many Hats (1167D, Rev. 12/2020), pp. 10–11",topic:"roles"},{id:"en_ah_counter",priority:1,terms:["ah-counter","아 카운터","아카운터","필러워드","군더더기 말","불필요한 단어","filler words"],answer:"Ah-Counter는 연설 중 반복되거나 불필요한 단어·소리·멈춤을 듣고 사람별로 기록해 보고합니다. 예를 들면 ‘어’, ‘음’, ‘그러니까’ 같은 소리와 말버릇이 포함됩니다. 목적은 창피를 주는 것이 아니라 발표자가 자신의 습관을 알아차리고 연습하도록 돕는 것입니다.",source:"A Toastmaster Wears Many Hats (1167D, Rev. 12/2020), p. 11; Master Your Meetings (1312, Rev. 06/2026), p. 8",topic:"roles"},{id:"en_meeting_parts",priority:1,terms:["회의 구성","모임 구성","미팅 구성","meeting structure","세션 순서","준비 연설 평가 테이블 토픽"],answer:"매뉴얼은 정기 모임의 기본 요소로 준비 연설, 연설 평가, Table Topics를 설명합니다. 준비 연설에는 프로젝트 기반 연설을 배정하고 각 연설은 동료가 건설적으로 평가합니다. Table Topics는 아직 다른 역할이 없는 회원들이 즉흥 발언을 연습하는 시간입니다. 클럽 사무 회의는 클럽 업무를 위해 적어도 매달 한 번 열어야 하며, 세부 순서는 클럽에 맞게 조정하되 모임은 정시에 시작하고 끝내도록 합니다.",source:"Master Your Meetings (1312, Rev. 06/2026), p. 5",topic:"meetings"},{id:"en_agenda_90",priority:1,terms:["90분 회의","90분 agenda","1시간 반 회의","1시간 30분 회의","90 minute agenda"],answer:"90분 예시 안건은 개회와 환영·클럽 업무(약 15분), 역할 소개와 Table Topics(약 25분), 휴식(5분), 준비 연설 3편(약 23분), General Evaluator의 평가(약 12분), 시상과 마무리(약 10분)로 짜여 있습니다. 이는 예시이므로 발표 수, 휴식, 업무 회의 여부를 반영해 조정하세요. 핵심은 시작·종료 시각을 지키는 것입니다.",source:"Master Your Meetings (1312, Rev. 06/2026), p. 6",topic:"meetings"},{id:"en_agenda_60",priority:1,terms:["60분 회의","1시간 회의","1시간 agenda","one hour agenda","60 minute agenda"],answer:"1시간 예시 안건은 개회·환영·진행 소개, 짧은 역할 안내, 준비 연설 2편, Table Topics, 평가, 시상·마무리로 구성됩니다. 매뉴얼 예시는 5분에 Toastmaster 시작, 10분부터 연설, 26분 Table Topics, 45분 평가를 배치합니다. 실제 시간은 발표 길이와 클럽 규칙에 맞게 조정하세요.",source:"Master Your Meetings (1312, Rev. 06/2026), p. 7",topic:"meetings"},{id:"en_guest_experience",priority:1,terms:["게스트 환영","방문자 응대","손님 응대","게스트가 오면","guest","첫 방문"],answer:"매뉴얼은 도착한 게스트를 맞이하고, 경험이 있는 회원 옆에 앉혀 진행 순서를 설명하도록 권합니다. 게스트의 방문 목적을 묻고 클럽이 목표에 어떻게 도움 되는지 안내하세요. Table Topics 참여는 미리 의사를 물어보고 원치 않으면 존중해야 합니다. 게스트가 혼자 왔는지도 살펴 불편함 없이 참여할 수 있도록 돕습니다.",source:"Master Your Meetings (1312, Rev. 06/2026), pp. 3–4",topic:"members"},{id:"en_dcp_overview",priority:1,terms:["dcp 목표","dcp 10개","distinguished club program","우수클럽 목표","10 goals","10개 목표"],answer:"DCP에는 연간 10개 목표가 있고 네 범주로 나뉩니다. 교육 목표 1–6은 교육 성취, 회원 목표 7–8은 신규·복귀 등 회원 증가, 연수 목표 9는 임원 교육, 행정 목표 10은 회비와 임원 명단을 제때 제출하는 내용입니다.",source:"Distinguished Club Program (1111, Rev. 06/2026), pp. 5–9",topic:"dcp"},{id:"en_dcp_goals_education",priority:1,terms:["dcp 교육 목표","목표 1","goal 1","목표 2","level 1 awards","교육 성취 목표"],answer:"DCP 교육 목표 1–6은 다음 성취 수를 기준으로 합니다: Level 1 네 건, Level 2 두 건, 추가 Level 2 두 건, Level 3 두 건, Level 4·Path Completion·DTM 중 한 건, 그리고 같은 범주의 추가 한 건입니다. 개인당 한 프로그램 연도에 클럽이 인정받는 교육상 유형에는 제한이 있으므로, 적용 세부사항은 해당 연도의 DCP 원문을 확인하세요.",source:"Distinguished Club Program (1111, Rev. 06/2026), pp. 6–7",topic:"dcp"},{id:"en_dcp_goals_membership",priority:1,terms:["dcp 회원 목표","목표 7","goal 7","목표 8","신규 회원 dcp","membership goals"],answer:"DCP 회원 목표 7은 해당 프로그램 연도에 신규·이중·복귀 회원 네 명, 목표 8은 그에 더해 추가 네 명을 대상으로 합니다. 회원 신청서와 회비가 본부에 기한 내 접수되어야 인정될 수 있으며, 이적 회원과 명예 회원은 회원 목표 수에 포함되지 않습니다.",source:"Distinguished Club Program (1111, Rev. 06/2026), p. 7",topic:"dcp"},{id:"en_dcp_goal_training",priority:1,terms:["dcp 임원 교육","목표 9","goal 9","임원 연수","officer training dcp"],answer:"DCP 목표 9는 두 번의 교육 기간 각각에서 최소 네 개 임원 직책을 맡은 임원이 교육을 이수하는 것입니다. 첫 교육 기간은 6월 1일~8월 31일, 두 번째는 11월 1일~2월 말입니다. 선출된 본인 직책으로 교육을 받아야 하며, 사전 녹화 영상만 시청하는 것은 요건을 충족하지 않습니다.",source:"Distinguished Club Program (1111, Rev. 06/2026), pp. 7–8",topic:"dcp"},{id:"en_dcp_goal_admin",priority:1,terms:["dcp 행정 목표","목표 10","goal 10","회비 납부 dcp","행정 요건"],answer:"DCP 목표 10은 회비와 회원 명단을 해당 기간에 제때 제출하고, 임원 명단도 기한에 맞춰 제출하는 목표입니다. 매뉴얼은 한 회비 기간에 최소 8명(그중 기존 갱신 회원 최소 3명)의 명단을 동반하도록 설명합니다. 연회비 기간별 제출일은 10월 1일 또는 4월 1일이며, 정확한 적용은 최신 DCP와 클럽 기록을 확인하세요.",source:"Distinguished Club Program (1111, Rev. 06/2026), pp. 8–9",topic:"dcp"},{id:"en_dcp_eligibility",priority:1,terms:["dcp 자격","dcp 인증 조건","recognition requirements","우수클럽 자격","20명","순증가 3명","qualifying requirements"],answer:"2026년 6월 개정 DCP의 기본 인증 요건은 세 가지입니다: 클럽이 정상 상태(good standing)일 것, 6월 30일 기준 회원이 20명 이상이거나 신규·이중·복귀 회원 순증가가 3명 이상일 것, Club Success Plan을 9월 30일까지 제출할 것. 이 조건을 충족하지 못하면 목표 수를 달성해도 인증을 받을 수 없습니다. 새로 창립한 클럽에는 별도 기한이 있습니다.",source:"Distinguished Club Program (1111, Rev. 06/2026), pp. 5–6, 11–12",topic:"dcp"},{id:"en_dcp_levels",priority:1,terms:["distinguished 단계","dcp 등급","smedley distinguished","president's distinguished","select distinguished","인증 등급"],answer:"2026년 개정 DCP의 일반적인 인정 기준은 Distinguished: 목표 5개, Select Distinguished: 7개, President’s Distinguished: 9개, Smedley Distinguished: 10개입니다. 각 단계는 Club Success Plan 제출과 6월 30일 회원 수 요건도 충족해야 합니다. 실시간 성취 여부는 공식 보고서에서 확인하세요.",source:"Distinguished Club Program (1111, Rev. 06/2026), p. 10",topic:"dcp"},{id:"en_dcp_year",priority:1,terms:["프로그램 연도","dcp 기간","dcp 언제","7월 1일부터","6월 30일까지","연간 프로그램"],answer:"DCP 프로그램 연도는 7월 1일부터 다음 해 6월 30일까지입니다. 진행 현황은 Toastmasters 대시보드 보고서에서 확인하고, 목표와 계획은 클럽 운영진이 Club Success Plan을 기준으로 정기적으로 검토하도록 안내합니다.",source:"Distinguished Club Program (1111, Rev. 06/2026), p. 5",topic:"dcp"},{id:"en_success_plan",priority:1,terms:["club success plan","성공계획 작성","성공 계획","계획서 작성","계획 세우기","무엇을 언제 누가"],answer:"Club Success Plan은 회원의 목표와 클럽의 현실을 반영해 ‘무엇을, 언제, 어떻게, 누가’ 할지 정하는 실행 계획입니다. 교육 진척, 회원 모집·유지, 임원 교육, 행정 제출을 각각 담당자와 일정에 연결하고, 운영진이 정기적으로 현황을 점검해 조정합니다. 계획 제출 기한은 최신 DCP 기준으로 확인하세요.",source:"Distinguished Club Program (1111, Rev. 06/2026), pp. 12–13; Club Success Plan (1111CSP), pp. 2–7",topic:"dcp"},{id:"en_club_president",priority:1,terms:["클럽 회장","회장 역할","club president","president responsibilities","회장 책임"],answer:"클럽 회장은 클럽·업무·운영진 회의를 주재하고 안건이 진행되도록 돕습니다. 회원 경험과 클럽의 전반적 건강을 살피고, 임원진과 협력해 DCP와 회원 성취를 지원하며, 갈등을 존중하는 방식으로 조정합니다. 정기 모임에서는 환영, 개회, 공지, 다음 모임 안내와 정시 종료를 챙깁니다.",source:"Club Leadership Handbook (1310, Rev. 06/2026), pp. 16–18",topic:"officers"},{id:"en_vpe",priority:1,terms:["vpe","교육 부회장","교육 담당 임원","vice president education","교육 부회장 역할","교육 부회장 책임"],answer:"Vice President Education(VPE)은 최소 3주 앞서 클럽 일정과 역할 배정을 조정하고, Pathways 진행·교육 성취·완료 요청을 지원합니다. 신입 회원이 가입 후 두 번의 모임 안에 환영 메일을 받았는지 확인하고 첫 프로젝트를 시작하도록 돕습니다. 새 회원에게 멘토를 배정하고, 모임 역할이 빠지지 않게 확인하며, 교육·연설대회 질문의 담당 창구 역할을 합니다.",source:"Club Leadership Handbook (1310, Rev. 06/2026), pp. 19–22",topic:"officers"},{id:"en_vpm",priority:1,terms:["vpm","회원 부회장","회원 담당 임원","vice president membership","회원 부회장 역할","신입 회원 가입"],answer:"Vice President Membership(VPM)은 잠재 회원 문의에 답하고 게스트가 모임에 방문하도록 안내하며, 방문 중 환영과 질문 응대를 조정합니다. 게스트가 망설이면 다음 모임 방문을 제안하고, 가입을 원하면 신청 절차를 돕습니다. 신입 회원 승인과 입회식 일정을 회장과 조율하고, 회원 모집·유지 계획을 운영진과 함께 세웁니다.",source:"Club Leadership Handbook (1310, Rev. 06/2026), pp. 23–25",topic:"officers"},{id:"en_vppr",priority:1,terms:["vppr","홍보 부회장","홍보 담당 임원","vice president public relations","홍보 부회장 역할","클럽 홍보"],answer:"Vice President Public Relations(VPPR)은 클럽 활동과 성취를 알리고 모임 시간·장소와 온라인 접속 방법이 최신인지 관리합니다. 뉴스레터나 웹사이트·소셜 채널을 운영하고 게스트가 온라인 모임에 쉽게 접속하도록 정보를 정리합니다. 클럽의 공식 브랜드·표기 지침도 지켜야 합니다.",source:"Club Leadership Handbook (1310, Rev. 06/2026), pp. 26–29",topic:"officers"},{id:"en_secretary",priority:1,terms:["클럽 서기","서기 역할","club secretary","secretary responsibilities","회의록"],answer:"Club Secretary는 클럽과 운영진 회의의 회의록, 출석, 의사결정, 동의안 결과, 보고 및 서신을 정확히 기록·보관합니다. 회의록과 중요한 문서의 보존 기간은 문서 종류와 현지 법규에 따라 다르므로 클럽 정책과 지역 규정을 함께 확인해야 합니다.",source:"Club Leadership Handbook (1310, Rev. 06/2026), pp. 30–32",topic:"officers"},{id:"en_treasurer",priority:1,terms:["클럽 회계","회계 담당","treasurer","club treasurer","회계 역할","재무 담당"],answer:"Club Treasurer는 클럽 예산과 은행 계좌를 관리하고, 매월 입금·지출·잔액을 대조합니다. Toastmasters 국제 회비와 클럽 자체 회비를 정해진 기한에 제출하고, 승인된 비용을 지급하며 거래 기록을 정확히 유지합니다. 세금·법적 의무는 국가·지역별로 다르므로 현지 규정을 확인해야 합니다.",source:"Club Leadership Handbook (1310, Rev. 06/2026), pp. 33–35",topic:"officers"},{id:"en_saa",priority:1,terms:["sergeant at arms","의전 담당","사전 준비 담당","saa 역할","회의장 준비","세전트 앳 암즈"],answer:"Sergeant at Arms(SAA)는 배너·의사봉·강연대·타이머·상장 등 클럽 물품을 관리하고, 대면 장소나 온라인 회의실을 준비합니다. 대면 모임은 매뉴얼에 따라 시작 전에 공간과 장비를 배치하고, 온라인 모임은 링크·오디오·필요한 화면 자료를 확인합니다. 게스트 접근성·안전과 모임 후 정리도 책임 범위에 들어갑니다.",source:"Club Leadership Handbook (1310, Rev. 06/2026), pp. 37–39",topic:"officers"},{id:"en_officer_training",priority:1,terms:["임원 교육 기간","club officer training","임원 연수 일정","임원 교육 언제","교육 기간"],answer:"DCP 목표 9의 두 교육 기간은 첫 번째가 6월 1일~8월 31일, 두 번째가 11월 1일~2월 28일(윤년에는 29일)입니다. 각 기간에 최소 네 임원 직책을 맡은 임원이 본인 직책의 District 교육에 참여해야 합니다. 현재 연도의 교육 일정은 소속 District 안내를 확인하세요.",source:"Distinguished Club Program (1111, Rev. 06/2026), pp. 7–8",topic:"dcp"},{id:"about",terms:["toastmasters","토스트마스터즈","토스트마스터","어떤 곳","무슨 곳","무엇","목적","미션","mission","가입","처음","소개"],answer:"Toastmasters는 회원이 지지적이고 긍정적인 학습 환경에서 커뮤니케이션과 리더십을 개발하고 자신감과 개인적 성장을 이루도록 돕는 조직입니다. 클럽 모임에 참여하면서 연설, 평가, 역할 수행을 연습할 수 있어요. 방문 일정과 장소는 클럽마다 다르니 방문할 클럽에 확인해 주세요.",source:"우수클럽 프로그램 (KO-KR1111), ‘클럽 미션’"},{id:"values",terms:["가치","핵심 가치","core value","진실","존중","탁월","봉사","values"],answer:"Toastmasters International의 핵심 가치는 진실, 존중, 탁월, 봉사입니다. 클럽 활동에서는 서로를 존중하고, 건설적인 피드백을 주며, 함께 배우는 환경을 만드는 데 적용할 수 있습니다.",source:"우수클럽 프로그램 (KO-KR1111), ‘핵심 가치’"},{id:"promise",terms:["회원 책임","약속","참석","준비","게스트","회원으로서","회원의 의무"],answer:"회원은 모임에 정기적으로 참석하고, 교육 프로그램의 프로젝트와 맡은 역할을 준비하며, 동료에게 도움이 되는 건설적 평가를 제공하는 것을 약속합니다. 클럽 환경을 긍정적이고 친근하게 유지하고 게스트를 존중하는 것도 포함됩니다.",source:"우수클럽 프로그램 (KO-KR1111), ‘토스트마스터의 약속’"},{id:"mot",terms:["moments of truth","진실의 순간","첫인상","회원 오리엔테이션","친목","회원 경험"],answer:"Moments of Truth는 클럽 경험의 중요한 접점을 점검하는 기준입니다. 자료는 첫인상, 회원 오리엔테이션, 친목·다양성·커뮤니케이션, 프로그램 기획 및 모임 구성, 회원 수, 성취 인증을 다룹니다. 신입 회원이 환영받고 필요한 안내를 받는지 살펴보는 데 활용할 수 있어요.",source:"우수클럽 프로그램 (KO-KR1111), ‘우수클럽 프로그램의 성공 기반’"},{id:"dcp",terms:["dcp","우수클럽","우수 클럽","클럽 프로그램","10가지 목표","목표 범주"],answer:"우수클럽 프로그램(DCP)은 클럽이 매년 목표 달성을 위해 운영하는 프로그램입니다. 목표는 교육, 회원, 연수, 행정의 네 범주로 구성됩니다. 매뉴얼에 적힌 운영 주기는 7월 1일부터 다음 해 6월 30일까지예요. 특정 클럽의 현재 실적이나 최신 기준은 공식 대시보드와 클럽 운영진에게 확인해야 합니다.",source:"우수클럽 프로그램 (KO-KR1111), ‘우수클럽 프로그램’ 및 ‘원리’"},{id:"dcp_year",terms:["언제 시작","언제 끝","회계연도","주기","7월","6월","프로그램 기간"],answer:"우수클럽 프로그램 매뉴얼에는 연간 주기가 7월 1일부터 다음 해 6월 30일까지라고 안내되어 있습니다. 실제 적용 연도와 현재 클럽 진행 상황은 최신 공식 자료로 확인해 주세요.",source:"우수클럽 프로그램 (KO-KR1111), ‘원리’"},{id:"pathways",terms:["pathways","패스웨이","패스","학습경험","경로","프로젝트","레벨","한국어 제공","한국어 프로젝트"],answer:"한국어 Pathways 자료 KO925에는 11개 패스의 레벨별 프로젝트와 한국어 제공 여부가 정리되어 있습니다. 패스 이름이나 관심 있는 프로젝트를 알려주시면 목록에서 확인해 안내할 수 있어요. 다만 이 자료의 한국어 번역은 Toastmasters International 본부가 평가한 번역본이 아니라는 안내가 포함되어 있습니다.",source:"Pathways Projects Available in Korean (KO925), 목차 및 번역 고지"},{id:"paths_list",terms:["패스 종류","11개 패스","패스 이름","어떤 패스","패스 목록","path 종류"],answer:"KO925 목록의 11개 패스는 역동적 리더십, 효과적 코칭, 청중을 사로잡는 유머, 혁신적 계획, 리더십 개발, 동기부여 전략, 설득력 있는 영향, 프레젠테이션 마스터하기, 전략적 관계, 팀 협업, 비전 제시 커뮤니케이션입니다. 한국어 제공 프로젝트는 패스마다 다르므로 특정 프로젝트를 알려주시면 목록 기준으로 찾아볼게요.",source:"Pathways Projects Available in Korean (KO925), 목차"},{id:"mentor",terms:["멘토","멘토링","mentor","멘토 프로그램","멘토링 완료"],answer:"Toastmasters 자료에는 멘토링과 Pathways 멘토 프로그램 관련 자료가 있습니다. 다만 멘토 배정 방법과 완료 인정 절차는 클럽의 최신 안내에 따라 확인해야 합니다. 소속 클럽의 멘토 또는 교육 담당 임원에게 문의해 주세요.",source:"KO8951 Pathways 멘토 프로그램 완료 자료(파일 확보); 절차 본문은 아직 인덱싱되지 않음"},{id:"role",terms:["역할","모임 역할","타이머","평가자","토스트마스터 오브 더 이브닝","즉흥연설","사회자","진행자"],answer:"영어판 ‘A Toastmaster Wears Many Hats(1167D)’와 한국어판 ‘다양한 역할의 토스트마스터(KO1167D)’를 근거로 역할별 준비 방법을 안내할 수 있어요. 맡은 역할을 말해주시면 모임 전·중·후에 할 일을 정리해 드릴게요.",source:"A Toastmaster Wears Many Hats (1167D) 및 다양한 역할의 토스트마스터 (KO1167D)"},{id:"new_member",terms:["신입 회원","신규 회원","신입회원","오리엔테이션","목표","가입 후","처음 할 일"],answer:"신입 회원이라면 먼저 Toastmasters에서 키우고 싶은 역량을 정하고, 클럽 오리엔테이션에서 교육 프로그램과 회원의 책임을 확인하는 것이 좋습니다. 클럽에 멘토가 있다면 목표와 첫 프로젝트 준비를 함께 상의해 보세요. 개인별 계정 진행이나 구체적인 클럽 절차는 소속 클럽에 확인해 주세요.",source:"우수클럽 프로그램 (KO-KR1111), ‘회원 오리엔테이션’ 및 ‘토스트마스터의 약속’; 신입 회원 프로필 양식(KO1162F)"},{id:"club_success",terms:["클럽 성공","성공계획","club success plan","클럽 운영","운영진","임원"],answer:"클럽 성공계획은 교육 성취, 회원 모집·유지, 임원 교육, 행정 목표에 대해 담당자와 전략을 정리하는 실행 계획입니다. 임원진이 정기적으로 진행 상황을 검토하고 필요한 내용을 조정합니다. 클럽별 계획과 최신 제출 기한은 운영진에게 확인하세요.",source:"Club Success Plan (1111CSP); Distinguished Club Program (1111, Rev. 06/2026)"},{id:"contest",terms:["연설대회","대회","상장","참가증","speech contest"],answer:"연설대회 관련 한국어 자료로 상장과 참가증 세트(KO510K)를 보관하고 있습니다. 여기서는 대회의 최신 규칙이나 자격 요건을 확인하지 못했으므로, 규정과 일정은 최신 공식 대회 안내와 소속 클럽/디스트릭트에 확인해 주세요.",source:"연설대회 상장과 참가증 세트 (KO510K), 규정 안내가 아닌 서식 자료"},{id:"club_visit",terms:["방문","게스트","참관","모임 가고","클럽 찾기","클럽 어디"],answer:"게스트로 클럽 모임을 방문해 Toastmasters의 학습 환경을 경험할 수 있습니다. 모임 장소, 일정, 온라인 참여 여부는 클럽별로 다를 수 있으니 방문 전에 해당 클럽에 확인해 주세요. 자료의 클럽 미션은 회원의 커뮤니케이션과 리더십 개발을 돕는 긍정적 학습 경험을 제공하는 것입니다.",source:"우수클럽 프로그램 (KO-KR1111), ‘클럽 미션’ 및 ‘첫인상’"},{id:"documents",terms:["자료","문서","파일","pdf","양식","다운로드","어디 있어","자료실"],answer:"한국어 자료 외에 영어 공식 매뉴얼 5종(A Toastmaster Wears Many Hats, Distinguished Club Program, Club Leadership Handbook, Master Your Meetings, Club Success Plan)의 주요 내용을 검색할 수 있습니다. 전체 PDF와 추출 텍스트는 작업 폴더에 보관되어 있고 웹 챗봇에는 요약한 한국어 지식 항목을 연결했습니다.",source:"Toastmasters_Korean_Resources/English_Manuals 및 english_manual_knowledge.js"},{id:"pathways_terms",priority:2,terms:["패스웨이 pathways","pathways 용어","path level project base camp","pathways와 path","path와 level","project가 연설","베이스 캠프 base camp"],answer:`패스웨이(Pathways)는 커뮤니케이션과 리더십 역량을 기르는 Toastmasters의 교육 프로그램입니다. 그 안에서 학습 경로(Path)는 선택하는 학습 경로, 진행 단계(Level)는 그 경로의 진도 단계, 학습 활동(Project)은 연습 활동과 학습 과제예요. 프로젝트가 모두 연설인 것은 아닙니다. 베이스 캠프(Base Camp)는 학습 자료와 진행 상황을 확인하는 온라인 포털입니다.

학교에 비유하면 패스웨이(Pathways)는 교육과정, 경로(Path)는 전공, 단계(Level)는 학년, 프로젝트(Project)는 과제, 베이스 캠프(Base Camp)는 학생 포털에 해당합니다.`,source:"Pathways 자료 (June), 슬라이드 5–6",topic:"pathways",nexts:["베이스 캠프(Base Camp)에서 첫 패스(Path)는 어떻게 선택해?","패스웨이 레벨 1(Pathways Level 1)은 어떤 순서로 진행돼?"]},{id:"pathways_start",priority:2,terms:["베이스 캠프 base camp","base camp 패스 선택","첫 패스 선택","learning hub choose path","path 선택","패스웨이 시작","계정 로그인 pathways"],answer:`Pathways 자료의 화면 안내는 다음 순서입니다. ① 회원 신청서에 적은 이메일 주소로 베이스 캠프(Base Camp)에 로그인하고, 그 이메일 계정을 계속 사용할 수 있게 유지합니다. ② 내 홈(My Home)에서 학습 허브(Learning Hub)를 엽니다. ③ 패스 선택(Choose Path)에서 제공 경로를 살펴보고, 자료에 안내된 평가를 진행해 선택을 좁힙니다. ④ 선택한 패스(Path) 안에서 레벨 1(Level 1)의 첫 프로젝트(Project) 안내를 확인합니다.

화면 이름이나 로그인 방식은 업데이트될 수 있어 현재 포털의 안내를 우선하세요. 개인 계정 접근 문제가 있으면 클럽 교육 부회장(VPE)에게 문의해 주세요.`,source:"Pathways 자료 (June), 슬라이드 11–17 및 25–27",topic:"pathways",nexts:["패스웨이(Pathways)와 패스(Path)는 어떻게 달라?","자기소개 연설(Ice Breaker)은 어떻게 준비해?"]},{id:"pathways_evaluation_form",priority:2,terms:["평가 양식 evaluation form","평가지 전달","평가자에게 평가 폼","평가 리소스 공유","평가지를 언제","evaluation form 준비"],answer:"평가 양식(Evaluation Form)은 발표할 프로젝트에 맞는 양식을 찾아 준비합니다. Pathways 안내 자료는 평가자에게 발표 2–3일 전에 개별적으로 파일을 공유하도록 권합니다. 평가자가 인쇄본을 원하면 출력해서 모임 전에 전달하고, 특히 받고 싶은 피드백이 있다면 미리 알려 주세요. 프로젝트 이름과 ‘evaluation form’을 검색어로 사용해 양식을 찾는 팁도 소개합니다.",source:"Pathways 자료 (June), 슬라이드 43–46",topic:"pathways",nexts:["연설 평가자(Speech Evaluator)는 어떻게 피드백해?","설득력 있는 연설(Persuasive Speaking) 프로젝트는 무엇을 평가해?"]},{id:"persuasive_speaking",priority:2,terms:["설득력 있는 연설 persuasive speaking","persuasive speaking 평가","persuasive speech 프로젝트","설득 연설 평가 기준","설득력 있는 연설 평가"],answer:`설득력 있는 연설(Persuasive Speaking) 프로젝트의 목적은 설득 연설의 유형을 이해하고 클럽 모임에서 논리적으로 구성된 설득 연설을 하는 것입니다. 평가지가 안내하는 발표 시간은 5–7분이며 주제와 표현 방식은 자유롭습니다. 감정에 호소하기(appeal to emotions), 윤리(ethics), 논리(logic)에 호소할 수 있지만, 프로젝트 학습 내용을 요약하는 발표가 되어서는 안 됩니다.
